<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="קליק חתימה — חתימה דיגיטלית על מסמכי PDF ישירות מהדפדפן, ללא העלאה לשרת" />
    <title>קליק חתימה</title>
    <link rel="icon" type="image/png" href="./klik-icon.png" />
    <!-- Installable app (PWA): "add to home screen" / "install" saves it on the device -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#20a45c" />
    <link rel="apple-touch-icon" href="./klik-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="קליק חתימה" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Dancing+Script:wght@500;600;700&family=Caveat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Always load the newest deploy: reload once if the running app's JS is no
         longer what's served. Keeps a single plain link always up to date. -->
    <script>
      (function () {
        function check() {
          try {
            var el = document.querySelector('script[type="module"][src*="/assets/"]');
            var loaded = el && (el.getAttribute('src').match(/[\w.-]+\.js/) || [])[0];
            if (!loaded) return;
            fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' })
              .then(function (r) { return r.text(); })
              .then(function (html) {
                if (html.indexOf(loaded) === -1) {
                  if (sessionStorage.getItem('ogenReloadTo') !== loaded) {
                    sessionStorage.setItem('ogenReloadTo', loaded);
                    location.reload();
                  }
                } else {
                  sessionStorage.removeItem('ogenReloadTo');
                }
              }).catch(function () {});
          } catch (e) { /* ignore */ }
        }
        setTimeout(check, 1500);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') check();
        });
      })();
    </script>
    <!-- Credit badge: "דביר מערכות", shown small on every screen -->
    <img src="./dvir.png" alt="דביר מערכות" class="dvir-credit" />
    <style>
      .dvir-credit { position: fixed; bottom: 8px; left: 10px; height: 30px; width: auto; opacity: 0.85; z-index: 9999; pointer-events: none; }
      @media (max-width: 640px) { .dvir-credit { height: 24px; bottom: 6px; left: 8px; } }
    </style>
    <script>
      window.OpenNagishConfig = {
        position: 'bottom-right',
        lang: 'he',
        statementUrl: './legal.html#accessibility',
      };
    </script>
    <script src="./open-nagish.min.js" defer></script>
  </body>
</html>
